[package]
name = "open-pql-daemon"
version = "0.1.0"
edition = "2024"
description = "HTTP/WebSocket daemon exposing the Open PQL runner to a web UI"

[[bin]]
name = "open-pql-daemon"
path = "src/main.rs"

[dependencies]
openpql-runner = "=0.2.2"
openpql-pql-parser = "=0.2.2"
openpql-range-parser = "=0.2.2"
openpql-prelude = { version = "=0.2.2", features = ["serde"] }

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
